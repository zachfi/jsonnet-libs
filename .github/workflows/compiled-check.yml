# Ensure generated manifests stay in sync with jsonnet.
# When you change app/util.libsonnet or compiled/*/main.jsonnet, you must run
# `make -C compiled gen` and commit the updated out/ and compiled/*/gen/ files.
# CI runs `make -C compiled all` and fails if there are uncommitted or untracked
# changes in those directories.
name: Compiled manifest check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-compiled:
    name: Jsonnet compiled output up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install jb and tk
        run: |
          go install github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@latest
          go install github.com/grafana/tanka/cmd/tk@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run compiled check
        run: make -C compiled all
