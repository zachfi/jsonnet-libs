apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ldap-tls
  namespace: auth
spec:
  commonName: ldap.auth.svc.cluster.local
  dnsNames:
  - ldap.auth.svc.cluster.local
  - ldap.auth.svc.cluster.local
  duration: 720h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: vault-issuer
  privateKey:
    algorithm: ECDSA
  renewBefore: 504h
  secretName: ldap-tls
  usages:
  - server auth
